<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const V3 = THREE.Vector3;

// ---------- premium look: tone mapping + soft studio environment ----------
const renderer = stage._renderer, scene = stage._scene;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
{
  const env = new THREE.Scene();
  const dome = new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color('#cfdbe4'), side: THREE.BackSide }));
  env.add(dome);
  const panel = (w, h, pos, col, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(0, 0, 0); env.add(m); };
  panel(8, 5, [0, 8, 2], '#ffffff', 3.2);     // top softbox
  panel(4, 6, [7, 2, 4], '#fff6ec', 2.0);     // warm key strip
  panel(3, 6, [-7, 1, -3], '#dbeaff', 1.6);   // cool rim
  panel(10, 3, [0, -6, 0], '#e9eef2', 0.6);   // floor bounce
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.03).texture;
  scene.traverse(o => { if (o.isHemisphereLight) o.intensity = 0.25; if (o.isDirectionalLight) o.intensity *= 1.0; });
  scene.environmentIntensity = 0.6;
  stage._ground.material.opacity = 0.0;
}
stage.shadowRoot.querySelector('.toolbar').style.display = 'none';
stage.shadowRoot.querySelector('.note').style.display = 'none';

const PRESETS = [
  { a: '#72c9a3', b: '#72b2e4' },
  { a: '#9ed9d2', b: '#a6b8ee' },
  { a: '#b6dc9e', b: '#86cde0' },
];
const SAVE_KEY = 'cellGO3d.v7';
const DEF = { seed: 11, colorA: PRESETS[0].a, colorB: PRESETS[0].b, colorC: '#6f7c8b', colorO: '#f08072', dist: 'alternate', perAxis: 4, radius: 0.03, curve: 1, sheets: 3, wrinkle: 1, density: 0.5, atoms: true, spin: false };
let saved = {}; try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); } catch (e) {}
const P = Object.assign({}, DEF, saved);
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(P)); } catch (e) {} };

const gel = (name, c) => new THREE.MeshPhysicalMaterial({ name, color: c, roughness: 0.32, metalness: 0, clearcoat: 0.8, clearcoatRoughness: 0.15, envMapIntensity: 0.6 });
const mats = {
  A: gel('hydrogel_fiber_A', P.colorA),
  B: gel('hydrogel_fiber_B', P.colorB),
  C: new THREE.MeshStandardMaterial({ name: 'GO_carbon', color: P.colorC, roughness: 0.16, metalness: 0.12, envMapIntensity: 1.1 }),
  film: new THREE.MeshStandardMaterial({ name: 'GO_film', color: P.colorC, roughness: 0.5, metalness: 0, transparent: true, opacity: 0.12, depthWrite: false, side: THREE.DoubleSide }),
  Cb: new THREE.MeshStandardMaterial({ name: 'GO_bond', color: P.colorC, roughness: 0.26, metalness: 0.1, envMapIntensity: 1.0 }),
  O: new THREE.MeshStandardMaterial({ name: 'oxygen', color: P.colorO, roughness: 0.16, metalness: 0.08, envMapIntensity: 1.0 }),
  H: new THREE.MeshStandardMaterial({ name: 'hydrogen', color: '#f3f5f7', roughness: 0.16, metalness: 0.05, envMapIntensity: 1.0 }),
};

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function bake(base, matrices) {
  const bp = base.attributes.position.array, bn = base.attributes.normal.array, bi = base.index.array;
  const nv = bp.length / 3, ni = bi.length, k = matrices.length;
  const pos = new Float32Array(nv * k * 3), nor = new Float32Array(nv * k * 3), idx = new Uint32Array(ni * k);
  const v = new V3(), nm = new THREE.Matrix3();
  for (let j = 0; j < k; j++) {
    const m = matrices[j]; nm.getNormalMatrix(m); const o = j * nv;
    for (let i = 0; i < nv; i++) {
      v.fromArray(bp, i * 3).applyMatrix4(m).toArray(pos, (o + i) * 3);
      v.fromArray(bn, i * 3).applyMatrix3(nm).normalize().toArray(nor, (o + i) * 3);
    }
    for (let i = 0; i < ni; i++) idx[j * ni + i] = bi[i] + o;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}
function merge(geoms) {
  let nv = 0, ni = 0; for (const g of geoms) { nv += g.attributes.position.count; ni += g.index.count; }
  const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), idx = new Uint32Array(ni);
  let ov = 0, oi = 0;
  for (const g of geoms) {
    pos.set(g.attributes.position.array, ov * 3); nor.set(g.attributes.normal.array, ov * 3);
    const gi = g.index.array; for (let i = 0; i < gi.length; i++) idx[oi + i] = gi[i] + ov;
    ov += g.attributes.position.count; oi += gi.length; g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  return out;
}
const Y = new V3(0, 1, 0), Z = new V3(0, 0, 1);
const UNIT_CYL = new THREE.CylinderGeometry(1, 1, 1, 10, 1, true);
const UNIT_BALL = new THREE.SphereGeometry(1, 16, 11);
const stickM = (p, q, r) => { const d = new V3().subVectors(q, p); const L = d.length();
  return new THREE.Matrix4().compose(p.clone().add(q).multiplyScalar(0.5), new THREE.Quaternion().setFromUnitVectors(Y, d.divideScalar(L)), new V3(r, L, r)); };
const ballM = (p, r) => new THREE.Matrix4().compose(p, new THREE.Quaternion(), new V3(r, r, r));

// ---------- hydrogel fibers ----------
// Without sheets the fibers form a free network running along the three axes.
function freeFibers(rng) {
  const paths = [];
  let k = 0;
  for (let ax = 0; ax < 3; ax++) {
    const b = (ax + 1) % 3, c = (ax + 2) % 3;
    const LV = [0.17, 0.27, 0.36], lb = LV[ax], lc = LV[(ax + 2) % 3];
    const cells = [...shuffle([[1, 1], [-1, 1], [1, -1], [-1, -1]], rng), [0, 0], ...shuffle([[0, 1], [1, 0], [0, -1], [-1, 0]], rng)];
    for (let f = 0; f < P.perAxis; f++) {
      const [i, j] = cells[f % cells.length];
      const ob = i * lb + (rng() - 0.5) * 0.05, oc = j * lc + (rng() - 0.5) * 0.05;
      const l0 = 0.42 + rng() * 0.18, l1 = 0.42 + rng() * 0.18;
      const tb = (rng() - 0.5) * 0.5, tc = (rng() - 0.5) * 0.5;
      const bb = (rng() - 0.5) * 0.3 * P.curve, bc = (rng() - 0.5) * 0.3 * P.curve;
      const pts = [[-l0, 0, 0], [-l0 * 0.5, 0.75, 0.8], [0, 1, 0], [l1 * 0.5, 0.75, -0.8], [l1, 0, 0]].map(([s, wa, ws]) => {
        const v = [0, 0, 0]; v[ax] = s; v[b] = ob + tb * s * 2 + bb * wa; v[c] = oc + tc * s * 2 + bc * ws;
        return new V3(...v);
      });
      const r = P.radius * (0.9 + rng() * 0.2);
      const useA = P.dist === 'alternate' ? k % 2 === 0 : P.dist === 'axis' ? ax !== 1 : rng() < 0.5;
      paths.push({ pts: new THREE.CatmullRomCurve3(pts, false, 'centripetal').getSpacedPoints(160), r, useA, k });
      k++;
    }
  }
  return paths;
}
function fiberMeshes(paths) {
  const grp = new THREE.Group(); grp.name = 'hydrogel_network';
  for (const { pts, r, useA, k } of paths) {
    const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
    const tube = new THREE.TubeGeometry(curve, 160, r, 40, false); tube.deleteAttribute('uv');
    // softly rounded end caps (flattened hemispheres) read better than hard discs
    const caps = [[0, -1], [1, 1]].map(([t, sgn]) => {
      const out = curve.getTangent(t).multiplyScalar(sgn);
      const g = new THREE.SphereGeometry(r, 40, 10, 0, Math.PI * 2, 0, Math.PI / 2); g.deleteAttribute('uv');
      g.applyMatrix4(new THREE.Matrix4().compose(curve.getPoint(t), new THREE.Quaternion().setFromUnitVectors(Y, out), new V3(1, 0.35, 1)));
      return g;
    });
    const mesh = new THREE.Mesh(merge([tube, ...caps]), useA ? mats.A : mats.B);
    mesh.name = `fiber_${String(k + 1).padStart(2, '0')}_${useA ? 'A' : 'B'}`;
    grp.add(mesh);
  }
  return grp;
}

// ---------- graphene oxide sheets ----------
const SHEETS = [

// Sheets first: one loose, irregular cluster. Sheets lie at mixed angles (level, upright

const FRAMES = [[[1, 0, 0], [0, 0, 1]], [[0, 0, 1], [0, 1, 0]], [[0, 1, 0], [1, 0, 0]]];   // normals y, x, z

// centre height for a fiber of radius r lying on side `side` of pl at (s, t): it rests on
// the oxygen groups, lifted over the highest bit of surface under its own width

// Bend one fiber until it is clear of every sheet. A stretch that crosses a sheet is
// pushed sideways past the nearest edge; a stretch that only lies against a face is
// pushed off that face. Returns false if it could not be cleared.
function deflect(f, sheets) {
  const m = f.r + SKIN + GAP;

    for (const pl of sheets) {

      if (!bad.length) continue;

        const crosses = a > 0 && b < last && hA * hB < 0;
        if (crosses) {

          const T = pts[Math.min(b + 1, last)].clone().sub(pts[Math.max(a - 1, 0)]);
          let ps = -T.dot(pl.V), pt = T.dot(pl.U);

          if (ps * ms + pt * mt < 0) { ps = -ps; pt = -pt; }

          const push = sgn => { const out = []; let cost = 0;
            for (let i = lo; i <= hi; i++) {

              cost += lam; out.push(pts[i].clone().addScaledVector(pl.U, lam * sgn * ps).addScaledVector(pl.V, lam * sgn * pt));

          const pref = (a === 0 ? hB : b === last ? hA : hs) >= 0 ? 1 : -1;

            for (let i = a; i <= b; i++) { const L = local(pl, pts[i]); out.push(pts[i].clone().addScaledVector(pl.N, side * (zone + flank(pl, L.s, L.t, f.r, side) + 0.006) - L.h)); }

      const clear = Xs => !sheets.some(pl => Xs.some(X => nearSheet(pl, X, m)));

      const q = pts.map(p => p.clone());
      for (let i = 1; i < last; i++) pts[i].copy(q[i - 1]).add(q[i + 1]).multiplyScalar(0.25).addScaledVector(q[i], 0.5);

  const { U, V: Vv, N, C } = def;   // def is a placement from placeSheets()
  const w = P.wrinkle, { f1, f2, p1, p2, p3 } = def;   // same surface the fibers rest on
  const surf = (s, t) => C.clone().addScaledVector(U, s).addScaledVector(Vv, t)
    .addScaledVector(N, def.k1 * s * s + def.k2 * t * t + w * (def.A * Math.sin(s * 11 + f1) * Math.cos(t * 8 + f2) + 0.008 * Math.sin(s * 31 + t * 23 + f2)));
  const normalAt = (s, t) => { const e = 0.002, p = surf(s, t);
    return new V3().crossVectors(surf(s + e, t).sub(p), surf(s, t + e).sub(p)).normalize(); };
  const inside = (x, y) => { const th = Math.atan2(y / def.rh, x / def.rw);
    const rr = 1 + 0.07 * Math.sin(3 * th + p1) + 0.05 * Math.sin(5 * th + p2) + 0.035 * Math.sin(8 * th + p3);
    return Math.pow(Math.pow(Math.abs(x / def.rw), 2.6) + Math.pow(Math.abs(y / def.rh), 2.6), 1 / 2.6) < rr; };

  const xy = [], key = new Map();
  const jm = Math.ceil(def.rh * 1.25 / (1.5 * a)) + 1;
  for (let j = -jm; j <= jm; j++) {
    const im = Math.ceil(def.rw * 1.25 / (s3 * a)) + Math.abs(j) + 1;
    for (let i = -im; i <= im; i++) {
      const x = i * s3 * a + j * s3 * a / 2, y = j * 1.5 * a;
      if (inside(x, y)) { key.set(`${i},${j},A`, xy.length); xy.push([x, y]); }
      if (inside(x, y + a)) { key.set(`${i},${j},B`, xy.length); xy.push([x, y + a]); }
    }
  }
  const adj = xy.map(() => new Set());
  for (const [kk, idx] of key) {
    const [i, j, s] = kk.split(','); if (s !== 'A') continue;
    for (const nk of [`${i},${j},B`, `${+i + 1},${j - 1},B`, `${i},${j - 1},B`]) {
      const o = key.get(nk); if (o !== undefined) { adj[idx].add(o); adj[o].add(idx); }
    }
  }
  const alive = xy.map(() => true);
  for (let changed = true; changed;) { changed = false;
    adj.forEach((s, i) => { if (alive[i] && s.size < 2) { alive[i] = false; changed = true; for (const o of s) adj[o].delete(i); s.clear(); } }); }

  const P3 = xy.map(([x, y], i) => alive[i] ? surf(x, y) : null);
  const balls = { C: [], O: [], H: [] }, sticks = { C: [], O: [], H: [] };
  const bond = (p, q, ep, eq, r) => { if (ep === eq) { sticks[ep].push(stickM(p, q, r)); return; }
    const m = p.clone().lerp(q, 0.5); sticks[ep].push(stickM(p, m, r)); sticks[eq].push(stickM(m, q, r)); };
  const doubleBond = (p, q, side, ep, eq) => { for (const s of [-1, 1]) { const o = side.clone().multiplyScalar(s * 0.0034); bond(p.clone().add(o), q.clone().add(o), ep, eq, R.gStick * 0.75); } };

  for (let i = 0; i < xy.length; i++) { if (!alive[i]) continue;
    if (P.atoms) balls.C.push(ballM(P3[i], R.cAtom));
    else if (adj[i].size === 3) balls.C.push(ballM(P3[i], R.cc * 1.02)); // tiny joint spheres keep the lattice seamless
    for (const o of adj[i]) if (o > i) sticks.C.push(stickM(P3[i], P3[o], R.cc));
  }

  if (dens > 0) {
    const used = new Set();
    const claim = (i) => { if (used.has(i)) return false; used.add(i); adj[i].forEach(o => used.add(o)); return true; };
    const order = shuffle(xy.map((_, i) => i).filter(i => alive[i]), rng);
    for (const i of order) {
      const [x, y] = xy[i], p = P3[i], nrm = normalAt(x, y), deg = adj[i].size;
      if (deg === 2) {
        const nb = [...adj[i]];
        const dx = -(xy[nb[0]][0] + xy[nb[1]][0] - 2 * x), dy = -(xy[nb[0]][1] + xy[nb[1]][1] - 2 * y);
        const dl = Math.hypot(dx, dy) || 1;
        const out = surf(x + dx / dl * a, y + dy / dl * a).sub(p).normalize();
        const roll = rng();
        if (roll < 0.09 * dens && claim(i)) {          // edge –COOH
          const cc = p.clone().addScaledVector(out, a * 1.07);
          const o1 = cc.clone().addScaledVector(out, a * 0.43).addScaledVector(nrm, a * 0.74);
          const o2 = cc.clone().addScaledVector(out, a * 0.47).addScaledVector(nrm, -a * 0.82);
          const h = o2.clone().addScaledVector(new V3().copy(out).addScaledVector(nrm, -0.35).normalize(), a * 0.68);
          balls.C.push(ballM(cc, P.atoms ? R.cAtom : R.gStick * 1.05));
          balls.O.push(ballM(o1, R.O), ballM(o2, R.O)); balls.H.push(ballM(h, R.H));
          bond(p, cc, 'C', 'C', R.gStick);
          doubleBond(cc, o1, new V3().crossVectors(out, nrm).normalize(), 'C', 'O');
          bond(cc, o2, 'C', 'O', R.gStick); bond(o2, h, 'O', 'H', R.gStick);
        } else if (roll < 0.13 * dens && claim(i)) {   // edge –OH
          const o = p.clone().addScaledVector(out, a * 1.0);
          const h = o.clone().addScaledVector(new V3().copy(out).addScaledVector(nrm, 0.9).normalize(), a * 0.68);
          balls.O.push(ballM(o, R.O)); balls.H.push(ballM(h, R.H));
          bond(p, o, 'C', 'O', R.gStick); bond(o, h, 'O', 'H', R.gStick);
        }
      } else if (rng() < 0.035 * dens && claim(i)) {   // basal –OH
        const side = rng() < 0.5 ? 1 : -1, n2 = nrm.clone().multiplyScalar(side);
        const o = p.clone().addScaledVector(n2, a * 1.0);
        const tdir = surf(x + a, y + a * 0.3).sub(p).normalize();
        const h = o.clone().addScaledVector(n2.clone().multiplyScalar(0.35).addScaledVector(tdir, 0.94).normalize(), a * 0.68);
        balls.O.push(ballM(o, R.O)); balls.H.push(ballM(h, R.H));
        bond(p, o, 'C', 'O', R.gStick); bond(o, h, 'O', 'H', R.gStick);
      } else if (rng() < 0.025 * dens) {               // basal epoxy C–O–C
        const q = [...adj[i]].find(o => adj[o].size === 3 && !used.has(o));
        if (q !== undefined && claim(i)) {
          used.add(q); adj[q].forEach(o => used.add(o));
          const side = rng() < 0.5 ? 1 : -1, n2 = nrm.clone().multiplyScalar(side);
          const o = p.clone().lerp(P3[q], 0.5).addScaledVector(n2, a * 0.85);
          balls.O.push(ballM(o, R.O));
          bond(p, o, 'C', 'O', R.gStick); bond(P3[q], o, 'C', 'O', R.gStick);
        }
      }
    }
  }

  const grp = new THREE.Group(); grp.name = `GO_sheet_${n}`;
  { // faint basal-plane film gives each flake body without hiding the lattice
    const st = a * 0.9, ex = def.rw * 1.15, ey = def.rh * 1.15, nx = Math.ceil(2 * ex / st), ny = Math.ceil(2 * ey / st);
    const pos = [], ids = [], vi = new Map();
    const vid = (i, j) => { const k = i * 10000 + j; if (vi.has(k)) return vi.get(k); const p = surf(-ex + i * st, -ey + j * st); vi.set(k, pos.length / 3); pos.push(p.x, p.y, p.z); return vi.get(k); };
    for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
      const x = -ex + (i + 0.5) * st, y = -ey + (j + 0.5) * st;
      if (!inside(x * 1.03, y * 1.03)) continue;
      const v00 = vid(i, j), v10 = vid(i + 1, j), v01 = vid(i, j + 1), v11 = vid(i + 1, j + 1);
      ids.push(v00, v10, v11, v00, v11, v01);
    }
    const fg = new THREE.BufferGeometry(); fg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); fg.setIndex(ids); fg.computeVertexNormals();
    const fm = new THREE.Mesh(fg, mats.film); fm.name = `GO${n}_film`; fm.renderOrder = -1; grp.add(fm);
  }
  const add = (list, base, mat, nm) => { if (!list.length) return; const m = new THREE.Mesh(bake(base, list), mat); m.name = `GO${n}_${nm}`; grp.add(m); };
  add(sticks.C, UNIT_CYL, mats.Cb, 'C_bonds'); add(balls.C, UNIT_BALL, mats.C, 'C_atoms');
  add(sticks.O, UNIT_CYL, mats.O, 'O_bonds'); add(balls.O, UNIT_BALL, mats.O, 'O_atoms');
  add(sticks.H, UNIT_CYL, mats.H, 'H_bonds'); add(balls.H, UNIT_BALL, mats.H, 'H_atoms');
  return grp;
}

let current = null, currentR = 1, first = true;
function build() {
  const rng = mulberry32(P.seed);
  const model = new THREE.Group(); model.name = 'Cellulose_GO_hydrogel';
  let sheets = placeSheets(P.sheets);
  const paths = buildFibers(rng, sheets);
  separate(paths, sheets);
  const straight = paths.map(f => f.pts);
  let stuck = [];
  for (let round = 0; round < 10; round++) {
    paths.forEach((f, i) => { f.pts = straight[i]; });
    stuck = paths.filter(f => !deflect(f, sheets));
    if (!stuck.length) break;
    // a fiber could not get round: shrink the sheets it still meets, then bend again
    for (const pl of sheets) if (stuck.some(f => f.pts.some(X => nearSheet(pl, X, f.r + SKIN + GAP)))) {
      pl.rw *= 0.8; pl.rh *= 0.8; pl.samples = sheetSamples(pl);
    }
  }
  // bending may have pushed fibers into each other: separate again, then re-check the sheets;
  // a fiber that cannot be cleared again keeps its earlier shape, which is clear of every sheet
  if (!stuck.length) {
    const cleared = paths.map(f => f.pts.map(v => v.clone()));   // separate() moves points in place
    separate(paths, sheets);
    paths.forEach((f, i) => { if (!deflect(f, sheets)) f.pts = cleared[i]; });
  }
  // last resort if shrinking was not enough: leave out a sheet a fiber still meets
  if (stuck.length) sheets = sheets.filter(pl => !stuck.some(f => f.pts.some(X => nearSheet(pl, X, f.r + SKIN + GAP))));
  model.add(fiberMeshes(paths));
  const go = new THREE.Group(); go.name = 'graphene_oxide';
  sheets.forEach((pl, i) => go.add(buildSheet(pl, i + 1, mulberry32(P.seed * 31 + i))));
  model.add(go);
  model.rotation.y = 0.32;
  const cam = stage._camera, ctl = stage._controls;
  // on a rebuild keep the viewing direction and relative zoom, re-centred on the new model
  const keep = !first ? { dir: cam.position.clone().sub(ctl.target), r: currentR } : null;
  if (current) current.traverse(o => o.isMesh && o.geometry.dispose());
  stage.setObject(model); current = model; first = false;
  const sph = new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());
  currentR = sph.radius;   // kept out of userData so it never ends up in the GLB
  if (keep) { ctl.target.copy(sph.center); cam.position.copy(sph.center).addScaledVector(keep.dir, sph.radius / keep.r); }
  else { ctl.target.copy(sph.center); cam.position.copy(sph.center).add(new V3(0.9, 0.45, 0.6).normalize().multiplyScalar(sph.radius * 1.8 * Math.max(1, 0.8 / cam.aspect))); }   // portrait screens: back off so the width fits
  ctl.update();
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
const busy = $('busy');
let timer; const rebuild = () => { document.body.style.cursor = 'progress'; clearTimeout(timer); timer = setTimeout(() => { build(); document.body.style.cursor = ''; save(); }, 30); };
const fmt = { perAxis: v => v, radius: v => (+v).toFixed(3), curve: v => (+v).toFixed(1), sheets: v => v, wrinkle: v => (+v).toFixed(1), density: v => (+v).toFixed(1) };
for (const k of Object.keys(fmt)) {
  const el = $(k); el.value = P[k]; $(k + 'V').textContent = fmt[k](P[k]);
  el.addEventListener('input', () => { $(k + 'V').textContent = fmt[k](el.value); });
  el.addEventListener('change', () => { P[k] = +el.value; rebuild(); });
}
$('atoms').checked = P.atoms; $('atoms').addEventListener('change', () => { P.atoms = $('atoms').checked; rebuild(); });
$('spin').checked = P.spin; stage._controls.autoRotate = P.spin;
$('spin').addEventListener('change', () => { P.spin = $('spin').checked; stage._controls.autoRotate = P.spin; save(); });
const segBtns = [...$('dist').children];
const syncSeg = () => segBtns.forEach(b => b.classList.toggle('on', b.dataset.v === P.dist));
segBtns.forEach(b => b.addEventListener('click', () => { P.dist = b.dataset.v; syncSeg(); rebuild(); })); syncSeg();
$('reseed').addEventListener('click', () => { P.seed = (Math.random() * 1e6) | 0; rebuild(); });
$('phead').addEventListener('click', () => { const c = $('panel').classList.toggle('closed'); $('ptoggle').textContent = c ? '展开' : '收起'; });
$('glb').addEventListener('click', () => stage._runExport('glb'));
$('obj').addEventListener('click', () => stage._runExport('obj'));

function applyColors() {
  mats.A.color.set(P.colorA); mats.B.color.set(P.colorB); mats.C.color.set(P.colorC); mats.film.color.set(P.colorC); mats.Cb.color.set(P.colorC).lerp(new THREE.Color('#ffffff'), 0.4); mats.film.color.set(P.colorC).lerp(new THREE.Color('#ffffff'), 0.5); mats.O.color.set(P.colorO);
  for (const [id, k] of [['colorA', 'colorA'], ['colorB', 'colorB'], ['colorC', 'colorC'], ['colorO', 'colorO']]) $(id).value = P[k];
  $('kA').style.background = P.colorA; $('kB').style.background = P.colorB; $('kC').style.background = P.colorC; $('kO').style.background = P.colorO;
  [...$('presets').children].forEach((b, i) => b.classList.toggle('on', PRESETS[i].a === P.colorA && PRESETS[i].b === P.colorB));
  save();
}
PRESETS.forEach(p => { const b = document.createElement('button');
  b.innerHTML = `<i><b style="background:${p.a}"></b><b style="background:${p.b}"></b></i>`;
  b.addEventListener('click', () => { P.colorA = p.a; P.colorB = p.b; applyColors(); }); $('presets').appendChild(b); });
for (const k of ['colorA', 'colorB', 'colorC', 'colorO']) $(k).addEventListener('input', e => { P[k] = e.target.value; applyColors(); });

$('png').addEventListener('click', () => {
  const r = renderer, pr = r.getPixelRatio(), w = stage.clientWidth, h = stage.clientHeight;
  stage._ground.visible = false; r.setPixelRatio(3); r.setSize(w, h); r.render(scene, stage._camera);
  const url = r.domElement.toDataURL('image/png');
  stage._ground.visible = true; r.setPixelRatio(pr); r.setSize(w, h);
  const a = document.createElement('a'); a.href = url; a.download = 'cellulose_GO_hydrogel.png'; document.body.appendChild(a); a.click(); a.remove();
});

applyColors();
build();
</script>
